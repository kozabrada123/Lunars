[package]
name = "lunars"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "lunars"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Api dependencies
rocket = { version = "0.5.1", features = ["json"] }
rocket_db_pools = { version = "0.2.0", features = ["sqlx_mysql"] }
rocket_okapi = { version = "0.9.0", features = ["swagger"] }
schemars = { version = "0.8.22", features = ["chrono"]}

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_with = { version = "3.22.0", features = ["chrono"] }

# Common
substring = "1.4.5"
dotenv = "0.15.0"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"

# Cryptography
sha2 = "0.11.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql", "macros", "migrate", "chrono"] }

# Log
log = "0.4.33"
tokio = { version = "1.53", features = ["full"] }
rocket_cors = "0.6.0"
hex = "0.4.3"
simplelog = "0.12.2"

